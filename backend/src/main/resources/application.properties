spring.application.name=${APPLICATION_NAME:exam-practice}

spring.datasource.url=${DATASOURCE_URL:jdbc:sqlite:database.db}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER_CLASS_NAME:org.sqlite.JDBC}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=1000MB

logging.level.org.apache.pdfbox=ERROR
